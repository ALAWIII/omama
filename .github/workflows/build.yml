name: Build & Release

on:
  push:
    tags:
      - '*'
permissions:
   contents: write
jobs:

  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.0

      - name: Install dependencies for Linux build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            libssl-dev \
            libudev-dev \
            libxcb1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxrender-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux executable
        run: flutter build linux

      - name: Zip Linux build
        run: |
          mkdir -p dist
          zip -r dist/linux-build.zip build/linux/x64/release/bundle/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/linux-build.zip


  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.0

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows executable
        run: flutter build windows

      - name: Zip Windows build
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\windows-build.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/windows-build.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
           artifacts/linux/linux-build.zip
           artifacts/windows/windows-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
